name: Monitor albi pretori SSR

on:
  schedule:
    # Aggiornamenti alle 15:00 e alle 20:00 ora italiana, tutto l'anno.
    # GitHub ragiona in UTC: si programmano entrambe le varianti (ora legale e ora solare)
    # e il job "controllo" lascia passare solo quella corretta per il periodo dell'anno.
    - cron: "0 13 * * *"   # 15:00 con ora legale
    - cron: "0 14 * * *"   # 15:00 con ora solare
    - cron: "0 18 * * *"   # 20:00 con ora legale
    - cron: "0 19 * * *"   # 20:00 con ora solare
  workflow_dispatch:        # avvio manuale dal tab Actions (sempre eseguito)

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: monitor-albi
  cancel-in-progress: false

jobs:
  controllo:
    runs-on: ubuntu-latest
    outputs:
      esegui: ${{ steps.orario.outputs.esegui }}
    steps:
      - id: orario
        run: |
          OFFSET=$(TZ=Europe/Rome date +%z)
          ESEGUI=true
          if [ "${{ github.event_name }}" = "schedule" ]; then
            case "${{ github.event.schedule }}" in
              "0 13 * * *"|"0 18 * * *") [ "$OFFSET" = "+0200" ] || ESEGUI=false ;;
              "0 14 * * *"|"0 19 * * *") [ "$OFFSET" = "+0100" ] || ESEGUI=false ;;
            esac
          fi
          echo "Fuso Europe/Rome: $OFFSET - esecuzione: $ESEGUI"
          echo "esegui=$ESEGUI" >> "$GITHUB_OUTPUT"

  monitor:
    needs: controllo
    if: needs.controllo.outputs.esegui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 110
    environment:
      name: github-pages
      url: ${{ steps.pubblica.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Scansione albi
        run: python monitor.py
      - name: Salvataggio stato e archivio
        run: |
          git config user.name "monitor-albi"
          git config user.email "monitor-albi@users.noreply.github.com"
          git add seen.json archivio_atti.csv
          git diff --staged --quiet || git commit -m "Aggiornamento $(date +%F)"
          git push
      - name: Preparazione sito
        uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sito
      - name: Pubblicazione sito
        id: pubblica
        uses: actions/deploy-pages@v4
